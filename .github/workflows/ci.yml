name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @shopstack/db generate
        env:
          DATABASE_URL: mysql://shopstack:shopstack@localhost:3306/shopstack
      - run: pnpm typecheck
        env:
          DATABASE_URL: mysql://shopstack:shopstack@localhost:3306/shopstack
